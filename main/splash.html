<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Tema claro por defecto; main.ts agrega ?theme=dark según la preferencia guardada de la caja. */
    :root { --bg: #F0F4F8; --fg: #0f172a; --muted: #64748b; --ring: #cbd5e1; --accent: #1E40AF; }
    :root[data-theme="dark"] { --bg: #041329; --fg: #f8fafc; --muted: #94a3b8; --ring: #1e3a5f; --accent: #60a5fa; }
    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      height: 100vh;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo { width: 180px; height: auto; }
    .logo.on-dark { display: none; }
    :root[data-theme="dark"] .logo.on-light { display: none; }
    :root[data-theme="dark"] .logo.on-dark { display: block; }
    .spinner {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid var(--ring); border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    p { font-size: 0.95rem; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // ?theme=dark|light lo pone main.ts (lee ui-prefs.json). Sin parámetro o inválido: claro.
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <svg class="logo on-light" width="224" height="48" viewBox="0 0 224 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Omero logo">
  <defs>
    <style>
      .wordmark { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: #1E40AF; letter-spacing: -1px; }
    </style>
  </defs>
  <!-- Icon: blue rounded square with O ring + arrow -->
  <rect width="48" height="48" rx="10" fill="#1E40AF"/>
  <circle cx="24" cy="25" r="11" fill="none" stroke="white" stroke-width="6"/>
  <polygon points="24,7 29,14 19,14" fill="white"/>
  <!-- Wordmark: "omero" in Inter ExtraBold -->
  <text x="62" y="38" class="wordmark">omero</text>
</svg>
  <svg class="logo on-dark" width="224" height="48" viewBox="0 0 224 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Omero logo white">
  <defs>
    <style>
      .wordmark { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: white; letter-spacing: -1px; }
    </style>
  </defs>
  <!-- Icon: white rounded square with O ring + arrow (for dark backgrounds) -->
  <rect width="48" height="48" rx="10" fill="white" fill-opacity="0.15"/>
  <circle cx="24" cy="25" r="11" fill="none" stroke="white" stroke-width="6"/>
  <polygon points="24,7 29,14 19,14" fill="white"/>
  <!-- Wordmark in white -->
  <text x="62" y="38" class="wordmark">omero</text>
</svg>
  <div class="spinner" role="progressbar" aria-label="Cargando"></div>
  <p>Cargando…</p>
</body>
</html>
