name: Build Windows Installer

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # El POS (Next) vive en web/ y se empaqueta dentro del instalador.
      # Ya no se descargan omero-backend.jar, JRE ni frontend.zip: el backend es el de Railway.
      - name: Install dependencies (Electron)
        run: npm ci

      - name: Install dependencies (web)
        run: npm ci --prefix web

      - name: Quality gates (typecheck + tests)
        run: |
          npm run check
          npm run check --prefix web

      # Variable de repositorio (Settings → Secrets and variables → Actions → Variables):
      # OMERO_DEFAULT_BACKEND_URL = origen del omero-backend de Railway, ej. https://omero-backend.up.railway.app
      # La app instalada la usa por defecto; se puede pisar con la variable de entorno BACKEND_URL.
      - name: Build installer
        run: npm run build:win
        env:
          OMERO_DEFAULT_BACKEND_URL: ${{ vars.OMERO_DEFAULT_BACKEND_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/omero-pos-setup.exe
