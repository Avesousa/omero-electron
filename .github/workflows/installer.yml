name: Build Installers

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    # windows-latest trae una Visual Studio tan nueva que node-gyp 9.4.1 (el que trae npm en Node 20)
    # todavía no reconoce ("gyp ERR! find VS unknown version 'undefined'") — rompe la compilación
    # desde código fuente de better-sqlite3. windows-2022 tiene el toolchain que node-gyp sí soporta.
    runs-on: windows-2022
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      prerelease: ${{ steps.channel.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4

      # Canal por el propio nombre del tag, sin tocar código: "v1.2.0" → producción (Release
      # estable); "v1.2.0-beta.1" (cualquier sufijo con "-") → beta (Release marcado prerelease).
      # GitHub excluye los prerelease de /releases/latest, que es lo que usan tanto el autoUpdater
      # como el endpoint /pos-download de omero — así el canal beta nunca se cuela en producción.
      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=production" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # El POS (Next) vive en web/ y se empaqueta dentro del instalador.
      # Ya no se descargan omero-backend.jar, JRE ni frontend.zip: el backend es el de Railway.
      - name: Install dependencies (Electron)
        run: npm ci

      - name: Install dependencies (web)
        run: npm ci --prefix web

      # better-sqlite3 es optionalDependency en web/ (para no romper el build de Docker sin ella).
      # `npm ci` intenta bajar el binario prebuilt para el ABI de Node del runner; si no hay uno
      # publicado para esta combinación de SO/arch/Node, npm SALTA el paquete en silencio (no queda
      # instalado, no falla `npm ci`) y los tests que necesitan SQLite real truenan con "Cannot find
      # module". `npm rebuild` no alcanza: si el paquete nunca se instaló no hay nada que recompilar
      # (termina en <2s sin hacer nada). Hay que instalarlo de nuevo a mano, forzando build-from-source
      # para no depender de un binario prebuilt.
      #
      # node-gyp (el que usa el "install" de better-sqlite3 para compilar) todavía depende del módulo
      # `distutils` de Python, que Python 3.12 eliminó de la librería estándar — el runner trae 3.12 por
      # defecto y la build falla con "ModuleNotFoundError: No module named 'distutils'". Se fija Python
      # 3.11 (última versión con distutils) solo para este paso.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install better-sqlite3 (build from source, Node ABI del runner)
        run: npm install better-sqlite3@12.11.1 --prefix web --no-save --build-from-source --foreground-scripts

      - name: Quality gates (typecheck + tests)
        run: |
          npm run check
          npm run check --prefix web

      # Variables de repositorio (Settings → Secrets and variables → Actions → Variables):
      # OMERO_BACKEND_URL_PRODUCTION / OMERO_BACKEND_URL_BETA = origen del omero-backend de Railway
      # para cada canal. La app instalada usa la que corresponda por defecto; se puede pisar con la
      # variable de entorno BACKEND_URL. `build:win` encadena: build:config → fetch:native (binarios
      # de better-sqlite3 con checksum fijado) → build:web → prepare:frontend → verify:native (carga
      # el binario con el ABI REAL de Electron; falla si no).
      - name: Build installer
        run: npm run build:win
        env:
          OMERO_DEFAULT_BACKEND_URL: ${{ steps.channel.outputs.channel == 'beta' && vars.OMERO_BACKEND_URL_BETA || vars.OMERO_BACKEND_URL_PRODUCTION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # latest.yml + .blockmap: metadata que electron-updater necesita para detectar la versión nueva
      # (autoUpdater en modo "solo avisar", ver main/main.ts). Sin esto el chequeo de updates no encuentra nada.
      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          files: |
            release/omero-pos-setup.exe
            release/latest.yml
            release/*.blockmap

  build-macos:
    needs: build-windows # evita que ambos jobs intenten crear el Release del tag al mismo tiempo
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies (Electron)
        run: npm ci

      - name: Install dependencies (web)
        run: npm ci --prefix web

      # Mismo motivo que en el job de Windows: fuerza la instalación de better-sqlite3 desde código
      # fuente para no depender de que exista un binario prebuilt publicado para este runner, y fija
      # Python 3.11 porque node-gyp todavía necesita `distutils` (Python 3.12 lo eliminó).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install better-sqlite3 (build from source, Node ABI del runner)
        run: npm install better-sqlite3@12.11.1 --prefix web --no-save --build-from-source --foreground-scripts

      - name: Quality gates (typecheck + tests)
        run: |
          npm run check
          npm run check --prefix web

      # Mismo canal que decidió build-windows (needs.build-windows.outputs), así los dos
      # instaladores del mismo tag quedan siempre en el mismo Release y con la misma URL de backend.
      - name: Build installer
        run: npm run build:mac
        env:
          OMERO_DEFAULT_BACKEND_URL: ${{ needs.build-windows.outputs.channel == 'beta' && vars.OMERO_BACKEND_URL_BETA || vars.OMERO_BACKEND_URL_PRODUCTION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # latest-mac.yml + .blockmap: mismo motivo que en el job de Windows (autoUpdater).
      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.build-windows.outputs.prerelease == 'true' }}
          files: |
            release/omero-pos.dmg
            release/latest-mac.yml
            release/*.blockmap
